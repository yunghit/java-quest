name: Build Android APK
on: { push: { branches: [main] }, workflow_dispatch: {} }
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VITE_FB_API_KEY: ${{ secrets.VITE_FB_API_KEY }}
      VITE_FB_AUTH_DOMAIN: ${{ secrets.VITE_FB_AUTH_DOMAIN }}
      VITE_FB_PROJECT_ID: ${{ secrets.VITE_FB_PROJECT_ID }}
      VITE_FB_APP_ID: ${{ secrets.VITE_FB_APP_ID }}
      VITE_CLD_CLOUD: ${{ secrets.VITE_CLD_CLOUD }}
      VITE_CLD_PRESET: ${{ secrets.VITE_CLD_PRESET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npm run build
      - run: '[ -d android ] || npx cap add android'
      - run: npx capacitor-assets generate --android || true
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: java-quest-apk, path: android/app/build/outputs/apk/debug/app-debug.apk }
